[project]
name = "care_filly"
version = "0.1.0"
description = "Self-hosted MedScribe-Alliance scribe backend: CARE plugin (Django) + standalone FastAPI server"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
standalone = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["care_filly", "care_filly.migrations"]
